# Docker Desktop 本地开发：网页 8787，MySQL 映射到本机 3308。
# 请通过 --env-file .env.docker.local 指定独立配置。
name: aihot-local

services:
  mysql:
    # 本机已有 mysql:8.0 镜像，优先复用，减少首次下载。
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aihot
      # root 是镜像自带账号，不能放进 MYSQL_USER 新建。
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请先生成 .env.docker.local}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8787
      BIND_ADDRESS: 0.0.0.0
      # 容器间通过服务名 mysql 和容器内端口 3306 通信。
      DB_URL: jdbc:mysql://mysql:3306/aihot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?请先生成 .env.docker.local}
      AI_PROVIDER: ${AI_PROVIDER:-bailian}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      # 页面自定义 AI 地址如需其他可信域名，在本地配置中填写；多个用逗号隔开。
      AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-}
      API_TOKEN: ${API_TOKEN:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      LEGACY_IMPORT: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8787}:8787"

volumes:
  mysql-data:
