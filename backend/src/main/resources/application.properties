spring.application.name=aihot
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8787}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/aihot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:aihot}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jackson.default-property-inclusion=non_null
spring.mvc.async.request-timeout=180000
aihot.ai-provider=${AI_PROVIDER:bailian}
aihot.bailian-api-key=${BAILIAN_API_KEY:}
aihot.bailian-model=${BAILIAN_MODEL:qwen-plus}
aihot.bailian-base-url=${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
aihot.siliconflow-api-key=${SILICONFLOW_API_KEY:}
aihot.siliconflow-model=${SILICONFLOW_MODEL:deepseek-ai/DeepSeek-V3.2}
aihot.openrouter-api-key=${OPENROUTER_API_KEY:}
aihot.openrouter-model=${OPENROUTER_MODEL:deepseek/deepseek-v3.2}
aihot.scheduler-enabled=${SCHEDULER_ENABLED:true}
aihot.poll-ms=${POLL_MS:60000}
aihot.max-analysis-per-run=${MAX_ANALYSIS_PER_RUN:12}
aihot.max-age-days=${MAX_AGE_DAYS:7}
aihot.ai-timeout-seconds=${AI_TIMEOUT_SECONDS:35}
aihot.source-timeout-seconds=${SOURCE_TIMEOUT_SECONDS:12}
aihot.legacy-import=${LEGACY_IMPORT:true}
aihot.api-token=${API_TOKEN:}
aihot.smtp-host=${SMTP_HOST:}
aihot.smtp-port=${SMTP_PORT:587}
aihot.smtp-user=${SMTP_USER:}
aihot.smtp-password=${SMTP_PASS:}
aihot.smtp-secure=${SMTP_SECURE:false}
aihot.notify-email=${NOTIFY_EMAIL:}
logging.level.cn.aihot=INFO
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SECURE:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000
